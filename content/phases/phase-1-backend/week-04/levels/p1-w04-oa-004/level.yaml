id: p1-w04-oa-004
title: Request a write-scoped service token
phase: 1
week: 4
module: oauth-oidc
order: 4
difficulty: 3
estimated_minutes: 8
type: console
environment: http
lesson: ../../lessons/01-oauth-and-oidc.md
task: A sync service must update records. Use Client Credentials to request the `api:write` scope and verify that the issued token grants it.
checks:
  - kind: sim_state
    action: client_credentials_scope
    scope: api:write
    expected: true
    label: Service token grants the write scope
  - kind: sim_state
    action: token_verified
    expected: true
    label: Service token signature and issuer are valid
  - kind: sim_state
    action: claim_equals
    claim: iss
    expected: https://login.fde.test
    label: Issuer is the trusted provider
hints:
  - Change the scope field to `api:write` before requesting the token.
  - Verify the issued token; an unverified token proves nothing.
tags: [oauth, client-credentials, scopes]
