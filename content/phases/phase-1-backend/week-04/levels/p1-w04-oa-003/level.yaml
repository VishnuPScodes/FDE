id: p1-w04-oa-003
title: Check the token audience
phase: 1
week: 4
module: oauth-oidc
order: 3
difficulty: 2
estimated_minutes: 7
type: console
environment: http
lesson: ../../lessons/01-oauth-and-oidc.md
task: Request an `api:read` service token and verify it. Confirm the audience claim names this client (`fde-browser-demo`) and that the token carries an expiry.
checks:
  - kind: sim_state
    action: token_verified
    expected: true
    label: Token is valid for this client
  - kind: sim_state
    action: claim_equals
    claim: aud
    expected: fde-browser-demo
    label: Audience matches this client
  - kind: sim_state
    action: claim_present
    claim: exp
    expected: true
    label: Token carries an expiry
hints:
  - Request the token first, then use Verify token; the audience is checked against the client ID.
  - Short expiry limits the damage of a leaked token.
unlocks: [p1-w04-oa-004]
tags: [oauth, audience, expiry]
