lesson: ../../lessons/03-secrets-and-pii.md
task: A feature only needs to greet users by first name. Choose the data handling that follows data minimization.
checks:
  - kind: sim_state
    action: multiple_choice
    question: Which approach follows data minimization?
    options:
      - Store only the first name the feature needs
      - Store the full profile in case it is useful later
      - Copy the user's government ID into the analytics table
      - Keep every field forever so reports stay complete
    expected: Store only the first name the feature needs
    label: Select minimal collection
hints:
  - Data you never collect cannot leak.
  - Collect only what the feature needs and keep it only as long as needed.
