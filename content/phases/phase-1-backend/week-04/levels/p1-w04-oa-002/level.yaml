id: p1-w04-oa-002
title: Request a service token
phase: 1
week: 4
module: oauth-oidc
order: 2
difficulty: 2
estimated_minutes: 7
type: console
environment: http
lesson: ../../lessons/01-oauth-and-oidc.md
task: Use the Client Credentials flow to request an access token for the `api:read` scope. Verify the token and inspect its issuer, audience, expiry, and service subject.
checks:
  - kind: sim_state
    action: client_credentials_scope
    scope: api:read
    expected: true
    label: Service token grants the requested read scope
  - kind: sim_state
    action: token_verified
    expected: true
    label: Service access token signature and issuer are valid
hints:
  - Client Credentials has no browser redirect or user consent step.
  - Use the demo client ID and secret shown in the workspace and request `api:read`.
tags: [oauth, client-credentials, service-accounts]
