      def test_latest_timestamp_advances_checkpoint():
          rows = [{"updated_at": "2026-02-03"}, {"updated_at": "2026-02-05"}, {"updated_at": "2026-02-04"}]
          assert next_checkpoint(rows, "2026-02-01") == "2026-02-05"

