      import pytest
      from main import normalize_phone

      def test_indian_prefix_and_punctuation():
          assert normalize_phone("+91 (98765) 43210") == "9876543210"

      def test_bad_length_is_rejected():
          with pytest.raises(ValueError):
              normalize_phone("12345")
