  - path: test_main.py
    content: |
      from main import run_etl

      CSV = "gstin,name,updated_at\n27ABCDE1234F1Z5, Acme ,2026-02-02\n,No GSTIN,2026-02-03\n"
      SOAP = '<Envelope><Body><Customer><GSTIN>27ABCDE1234F1Z5</GSTIN><Name>Acme Updated</Name><UpdatedAt>2026-02-05</UpdatedAt></Customer></Body></Envelope>'
      with open("incoming/customers.csv", encoding="utf-8-sig") as source:
          SFTP = source.read()

      def test_reconciles_and_quarantines():
          result = run_etl(CSV, SOAP, SFTP)
          assert [row["gstin"] for row in result["records"]] == ["27ABCDE1234F1Z5", "29ABCDE1234F1Z1"]
          assert result["records"][0]["name"] == "Acme Updated"
          assert result["records"][0]["source"] == "soap"
          assert result["checkpoint"] == "2026-02-05"
          assert result["quarantine"][0]["reason"] == "gstin is required"
          assert result["counts"] == {"read": 4, "accepted": 2, "duplicates": 1, "rejected": 1}

      def test_empty_feeds_are_safe():
          result = run_etl("gstin,name,updated_at\n", "<Envelope/>", "gstin,name,updated_at\n")
          assert result["records"] == []
          assert result["counts"]["read"] == 0
          assert result["checkpoint"] is None

      def test_rerun_is_deterministic():
          assert run_etl(CSV, SOAP, SFTP) == run_etl(CSV, SOAP, SFTP)
