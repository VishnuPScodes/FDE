id: p1-w05-ts-013
title: Load several customers in parallel
phase: 1
week: 5
module: typescript-essentials
order: 12
difficulty: 3
estimated_minutes: 12
type: code
environment: ts
lesson: ../../lessons/02-async-and-ui.md
task: "Implement `loadNames` so it fetches all ids at the same time with `Promise.all` and returns the names in the same order as the ids."
starter_files:
  - path: main.ts
    content: |-
      type Customer = { id: string; name: string };
      const directory: Record<string, string> = { 'C-1': 'Asha Rao', 'C-2': 'Ravi Nair', 'C-3': 'Mina Das' };
      let started = 0;
      let active = 0;
      let maxActive = 0;

      async function fetchCustomer(id: string): Promise<Customer> {
        started += 1;
        active += 1;
        maxActive = Math.max(maxActive, active);
        await Promise.resolve();
        active -= 1;
        return { id, name: directory[id] };
      }

      async function loadNames(ids: string[]): Promise<string[]> {
        return [];
      }

      test('returns names in id order', async () => {
        expect(await loadNames(['C-3', 'C-1', 'C-2'])).toEqual(['Mina Das', 'Asha Rao', 'Ravi Nair']);
      });
      test('requests overlap instead of running one by one', async () => {
        started = 0; maxActive = 0;
        await loadNames(['C-1', 'C-2', 'C-3']);
        expect(started).toBe(3);
        expect(maxActive).toBe(3);
      });
checks:
  - kind: vitest_passes
    label: All behaviour checks pass
  - kind: file_contains
    path: main.ts
    expected: "Promise.all"
    label: Requests run together with Promise.all
hints:
  - "Map ids to promises first, without awaiting inside the map."
  - "Await `Promise.all(promises)` and map each customer to its name."
solution: solution/
unlocks: [p1-w05-ts-014]
tags: [typescript, async, promise-all]
