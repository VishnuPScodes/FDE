id: p1-w03-http-004
title: Retry a temporary server failure
phase: 1
week: 3
module: rest-api-design
order: 4
difficulty: 2
estimated_minutes: 6
type: console
environment: http
lesson: ../../lessons/01-http-fundamentals.md
task: Request `/api/flaky`. The first attempt returns a temporary `500`; retry the safe GET request and inspect the `200` response.
checks:
