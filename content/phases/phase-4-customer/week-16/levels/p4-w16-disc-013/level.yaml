lesson: ../../lessons/04-quantifying-pain.md
task: |-
  Hubli Cold Storage keeps stock in paper registers. From your interviews: three clerks each spend 2 hours a day updating registers, over 26 working days a month. Their loaded cost is about ₹300 an hour. Separately, about 1.5% of the ₹80 lakh of stock held each month spoils because old lots are missed.

  In `answer.md`, work out the clerk hours and rupees per month, then per year. Annualise the spoilage too. List every guess under **Assumptions**, and finish with a short problem statement.
starter_files:
- path: answer.md
  content: |
    # Cost of manual stock tracking

    ## Calculation
    <!-- Hours, then rupees, with the maths shown. -->

    ## Annual cost
    <!-- Clerk time per year, and spoilage per year. -->

    ## Assumptions
    <!-- Anything you estimated rather than heard. -->

    ## Problem statement
    <!-- Two or three sentences. Who, what, how much. No solution. -->
