task: >-
  Timed drill, 25 minutes. Kerala Gramin Co-operative Bank wants to speed up loan file checking (400
  files a month, 45 minutes each, three officers, scanned PDFs, some phone photos, Malayalam and
  English forms). Fill all eight headings. Write assumptions where you would normally ask.
timed: true
starter_files:
  - path: answer.md
    content: |
      # Full decomposition: loan file checking

      ## Goal
      <!-- Number, from, to, date. -->

      ## Users
      <!-- Who, and what each needs. -->

      ## Data
      <!-- Where it lives. How clean. -->

      ## Constraints
      <!-- Privacy, devices, budget, people. -->

      ## MVP
      <!-- Smallest test. -->

      ## Architecture
      <!-- Boxes and arrows. -->

      ## Risks
      <!-- Risk plus fix. -->

      ## Rollout
      <!-- Pilot, length, deciding number. -->
