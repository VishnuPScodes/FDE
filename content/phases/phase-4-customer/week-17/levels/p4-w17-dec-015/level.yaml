  - kind: checklist
    label: Self-review
    items:
      - Every heading has real content, not a placeholder
      - The Goal has a number
      - I wrote my assumptions in plain words
  - kind: ai_rubric
    rubric:
      - Goal is measurable and tied to a business result
      - MVP is small and testable
      - Assumptions are stated honestly
    min_score: 3
hints:
  - A vague request needs a narrow first goal. Pick one subject and one exam.
  - List your assumptions in a separate section so the owner can correct them quickly.
