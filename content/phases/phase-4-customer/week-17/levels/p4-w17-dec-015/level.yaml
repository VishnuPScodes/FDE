id: p4-w17-dec-015
title: 'Decomposition checkpoint: a vague school request'
phase: 4
week: 17
module: decomp-drills
order: 15
difficulty: 4
estimated_minutes: 30
type: decomposition
environment: writing
lesson: ../../lessons/02-decomposition-drills.md
task: >-
  Week 17 checkpoint. The owner of a school group in Nagpur (six schools, 4,000 students) says: "Use
  AI to improve our results." That is all you know.


  Fill all eight headings, and add an **Assumptions** section listing at least three things you
  assumed. Choose a goal that can be measured, and keep the MVP small.
timed: true
starter_files:
  - path: answer.md
    content: |
      # Decomposition checkpoint: a vague school request

      ## Goal
      <!-- Number, from, to, date. -->

      ## Users
      <!-- Who, and what each needs. -->

      ## Data
      <!-- Where it lives. How clean. -->

      ## Constraints
      <!-- Privacy, devices, budget, people. -->

      ## MVP
      <!-- Smallest test. -->

      ## Architecture
      <!-- Boxes and arrows. -->

      ## Risks
      <!-- Risk plus fix. -->

      ## Rollout
      <!-- Pilot, length, deciding number. -->

      ## Assumptions
      <!-- At least three, each one line. -->
