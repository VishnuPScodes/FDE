task: >-
  Sunrise Clinics: 6 front desk staff each spend 2 hours a day on reminder calls, 26 days a month.
  The loaded cost is ₹300 an hour. A reminder tool is expected to remove 60% of that work and costs
  ₹30,000 a month.


  Work it out step by step. Headings: Inputs, Calculation, Result, Assumptions. The Calculation must
  show total hours, money saved and the net benefit. Write the rupee figures with commas, as in
  1,00,000 or 93,600.
