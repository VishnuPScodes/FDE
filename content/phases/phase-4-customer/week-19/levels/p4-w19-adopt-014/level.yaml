task: 'Three months ago the Thrissur branch of a co-operative bank started using a file checking tool.
  Baseline: 45 minutes per file. Now: 15 minutes, measured on 60 files a month. The branch handles 480
  files a month. Loaded staff cost is ₹250 an hour.


  Write the 90-day update for the CEO with headings: Headline, Before and after, What it means, What we
  do not know yet, Next 90 days. Show hours and rupees and be honest about gaps.'
starter_files:
- path: answer.md
  content: |
    # Report 90-day results

    ## Headline
    <!-- One sentence with the main number. -->

    ## Before and after
    <!-- Baseline and now, same measure. -->

    ## What it means
    <!-- Hours and rupees. -->

    ## What we do not know yet
    <!-- Honest gaps. -->

    ## Next 90 days
    <!-- Two actions. -->
