id: p4-w19-adopt-009
title: Announce the change to staff
phase: 4
week: 19
module: change-management
order: 9
difficulty: 2
estimated_minutes: 15
type: writing
environment: writing
lesson: ../../lessons/02-change-management.md
task: 'Periyar Co-operative Bank is rolling out the scan checking tool to 14 clerks at its Aluva branch
  on Monday 2 March. Training is on Thursday 26 February at 3 pm. The senior clerk Lalitha Menon has tried
  it and agreed to help. Clerks fear for their jobs; the general manager has confirmed that no jobs will be cut.


  Write the message to the clerks with four headings: What is changing, What is not changing, When, Who
  to ask. Be plain and calm.'
starter_files:
- path: answer.md
  content: |
    # Announce the change to staff

    ## What is changing
    <!-- One or two plain sentences. -->

    ## What is not changing
    <!-- Include the thing people fear most. -->

    ## When
    <!-- A date, not "soon". -->

    ## Who to ask
    <!-- A named person. -->
