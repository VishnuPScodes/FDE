  path: answer.md
  expected: '## What is changing'
- kind: file_contains
  path: answer.md
  expected: '## What is not changing'
- kind: file_contains
  path: answer.md
  expected: '## When'
- kind: file_contains
  path: answer.md
  expected: '## Who to ask'
- kind: sim_state
