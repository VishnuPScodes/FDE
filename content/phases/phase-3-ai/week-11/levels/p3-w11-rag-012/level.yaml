        pass
- path: test_main.py
  content: |
    from main import build_context, check_citations

    CHUNKS = [
        {"id": "upi#3", "text": "UPI refunds reach the account within T+1 working days."},
        {"id": "upi#7", "text": "Disputes go to the bank if the refund is late & unpaid < 30 days."},
    ]


    def test_context():
        assert build_context(CHUNKS) == (
            '<chunk id="upi#3">UPI refunds reach the account within T+1 working days.</chunk>\n'
            '<chunk id="upi#7">Disputes go to the bank if the refund is late &amp; unpaid &lt; 30 days.</chunk>'
        )


    def test_check_citations():
        answer = (
            "Your refund should arrive by the next working day [upi#3]. "
            "If not, raise a dispute with your bank [upi#7] [upi#3]. "
            "Call us anytime! It is free [faq#2]."
        )
        assert check_citations(answer, CHUNKS) == {
            "cited": ["upi#3", "upi#7", "faq#2"],
            "unknown": ["faq#2"],
            "uncited_sentences": ["Call us anytime!"],
        }
