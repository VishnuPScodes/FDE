lesson: ../../lessons/03-hybrid-search-and-citations.md
task: |
  Every answer must cite the chunk it came from. You format the context with ids, ask the model to
  cite like `[upi#3]`, then check that each citation is real.

  Write:

  - `build_context(chunks)`: one `<chunk id="...">text</chunk>` per chunk, joined by `"\n"`.
    Escape `&`, `<`, `>` in the text with `html.escape(text, quote=False)`.
  - `check_citations(answer, chunks)`: find every `[id]` marker in `answer` with the regex
    `\[([A-Za-z0-9_.:-]+#\d+)\]`. Return a dict with:
    `"cited"` (ids in order of first appearance, no repeats),
    `"unknown"` (cited ids not in `chunks`, in order),
    and `"uncited_sentences"`: sentences of the answer (split after `.`, `?` or `!` followed by
    whitespace) that contain no marker, stripped, excluding empty ones.
