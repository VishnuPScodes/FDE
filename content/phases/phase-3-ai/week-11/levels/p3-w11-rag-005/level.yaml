- path: test_main.py
  content: |
    import math
    import zlib

    from main import hashed_vector, tokenize


    def test_tokenize():
        assert tokenize("UPI refund, ₹500 — रिफंड कब?") == ["upi", "refund", "500", "रिफंड", "कब"]


    def test_vector_is_unit_length():
        vector = hashed_vector("upi refund status", 32)
        assert len(vector) == 32
        assert math.isclose(math.sqrt(sum(v * v for v in vector)), 1.0)


    def test_uses_crc32_buckets():
        vector = hashed_vector("refund refund", 16)
        index = zlib.crc32(b"refund") % 16
        assert vector[index] == 1.0
        assert sum(vector) == 1.0


    def test_empty_text():
        assert hashed_vector("!!!", 8) == [0.0] * 8


    def test_deterministic():
        assert hashed_vector("card blocked", 64) == hashed_vector("Card BLOCKED", 64)
