task: |
  Real embeddings come from a model. To learn vector search without a key, you will build a
  small, deterministic stand-in.

  Write:

  - `tokenize(text)`: lower-case, then return the list of words matched by `[a-z0-9\u0900-\u097f]+`
    (English letters, digits and Devanagari).
  - `hashed_vector(text, dim=32)`: start with `dim` zeros. For each token, add 1.0 at index
    `zlib.crc32(token.encode("utf-8")) % dim`. Then L2-normalise (divide by the vector's length).
    An all-zero vector stays all zeros.

  Use `zlib.crc32`, not Python's `hash()`. `hash()` changes between runs.
