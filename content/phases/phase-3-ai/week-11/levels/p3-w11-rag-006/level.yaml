- path: test_main.py
  content: |
    import pytest

    from main import cosine, top_k


    def test_cosine():
        assert cosine([1, 0], [1, 0]) == 1.0
        assert cosine([1, 0], [0, 1]) == 0.0
        assert round(cosine([1, 1], [1, 0]), 4) == 0.7071
        assert cosine([0, 0], [1, 1]) == 0.0


    def test_length_mismatch():
        with pytest.raises(ValueError):
            cosine([1, 2], [1, 2, 3])


    def test_top_k():
        items = [
            {"id": "kyc#0", "vector": [0.0, 1.0, 0.0]},
            {"id": "upi#2", "vector": [1.0, 1.0, 0.0]},
            {"id": "upi#1", "vector": [1.0, 0.0, 0.0]},
            {"id": "loan#4", "vector": [0.0, 0.0, 1.0]},
        ]
        assert top_k([1.0, 0.2, 0.0], items, 2) == [("upi#1", 0.9806), ("upi#2", 0.8321)]


    def test_ties_by_id():
        items = [{"id": "b", "vector": [1, 0]}, {"id": "a", "vector": [2, 0]}]
        assert top_k([1, 0], items, 2) == [("a", 1.0), ("b", 1.0)]
