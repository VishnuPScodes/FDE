task: |
  Vector search ranks chunks by how close their vectors are to the query vector.

  Write:

  - `cosine(a, b)`: dot product divided by the product of the lengths. Return 0.0 if either
    vector is all zeros. Raise `ValueError` if the lengths differ.
  - `top_k(query_vector, items, k)`: `items` is a list of `{"id": ..., "vector": [...]}`.
    Return a list of `(id, score)` tuples for the `k` best matches, score rounded to 4 places,
    highest first. Break ties by `id` ascending.
