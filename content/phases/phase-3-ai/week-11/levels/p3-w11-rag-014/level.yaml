- path: test_main.py
  content: |
    import pytest

    from main import cosine, dedupe_chunks


    def test_cosine_basics():
        assert cosine([1, 0], [1, 0]) == pytest.approx(1.0)
        assert cosine([1, 0], [0, 1]) == pytest.approx(0.0)
        assert cosine([0, 0], [1, 1]) == 0.0


    CHUNKS = [
        {"id": "faq-1", "vector": [1.0, 0.0, 0.0]},
        {"id": "faq-2", "vector": [0.99, 0.05, 0.0]},
        {"id": "loan-1", "vector": [0.0, 1.0, 0.0]},
        {"id": "faq-3", "vector": [2.0, 0.0, 0.0]},
        {"id": "empty", "vector": [0.0, 0.0, 0.0]},
        {"id": "empty-2", "vector": [0.0, 0.0, 0.0]},
    ]


    def test_drops_near_duplicates_keeps_first():
        assert dedupe_chunks(CHUNKS) == ["faq-1", "loan-1", "empty", "empty-2"]


    def test_strict_threshold_keeps_more():
        assert dedupe_chunks(CHUNKS, threshold=0.9999) == ["faq-1", "faq-2", "loan-1", "empty", "empty-2"]


    def test_compares_against_kept_only():
        chain = [
            {"id": "a", "vector": [1.0, 0.0]},
            {"id": "b", "vector": [1.0, 0.3]},
            {"id": "c", "vector": [1.0, 0.6]},
        ]
        assert dedupe_chunks(chain, threshold=0.95) == ["a", "c"]
