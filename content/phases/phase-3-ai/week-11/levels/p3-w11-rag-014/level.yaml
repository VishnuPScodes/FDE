task: |
  A bank's FAQ site repeats the same answer on five pages. If all five are indexed, one question returns the same text five times and crowds out other answers.

  Write `dedupe_chunks(chunks, threshold=0.95)`. Each chunk is `{"id": str, "vector": list[float]}`.

  - Go through the chunks in order and keep a chunk unless its cosine similarity with any **already kept** chunk is `>= threshold`.
  - A zero vector has similarity `0.0` with everything (no division by zero), so it is always kept.
  - Return the ids of the kept chunks, in the original order.
