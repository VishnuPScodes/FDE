lesson: ../../lessons/02-embeddings-and-vector-search.md
task: |
  Vector stores like pgvector or Qdrant do three things: store vectors with metadata, search them,
  and update them. Build a small one.

  Complete the `VectorIndex` class:

  - `__init__(dim)` stores the dimension.
  - `upsert(item_id, vector, metadata=None)` adds or replaces an item. Raise `ValueError` if the
    vector length is not `dim`. Store a **copy** of the vector, normalised to length 1 (zero vectors are rejected).
  - `delete(item_id)` removes it. Deleting an unknown id raises `KeyError`.
  - `query(vector, k, where=None)` returns `[(id, score)]` using the dot product with the normalised
    query, scores rounded to 4 places, highest first, ties by id. `where` is a dict of exact metadata matches.
  - `len(index)` returns the number of items.
