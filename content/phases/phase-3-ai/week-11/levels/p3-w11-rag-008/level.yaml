- path: test_main.py
  content: |
    import pytest

    from main import VectorIndex


    def build():
        index = VectorIndex(2)
        index.upsert("hdfc#1", [3.0, 4.0], {"bank": "HDFC"})
        index.upsert("sbi#1", [1.0, 0.0], {"bank": "SBI"})
        index.upsert("sbi#2", [0.0, 2.0], {"bank": "SBI"})
        return index


    def test_query():
        assert build().query([1.0, 0.0], 2) == [("sbi#1", 1.0), ("hdfc#1", 0.6)]


    def test_where():
        assert build().query([1.0, 0.0], 5, where={"bank": "SBI"}) == [("sbi#1", 1.0), ("sbi#2", 0.0)]


    def test_upsert_replaces():
        index = build()
        index.upsert("sbi#1", [0.0, 1.0], {"bank": "SBI"})
        assert len(index) == 3
        assert index.query([0.0, 1.0], 1) == [("sbi#1", 1.0)]


    def test_stores_a_copy():
        index = VectorIndex(2)
        vector = [1.0, 0.0]
        index.upsert("a", vector)
        vector[0] = -5.0
        assert index.query([1.0, 0.0], 1) == [("a", 1.0)]


    def test_errors():
        index = build()
        with pytest.raises(ValueError):
            index.upsert("bad", [1.0, 2.0, 3.0])
        with pytest.raises(ValueError):
            index.upsert("zero", [0.0, 0.0])
        with pytest.raises(KeyError):
            index.delete("nope")
        index.delete("hdfc#1")
        assert len(index) == 2
checks:
- kind: pytest_passes
