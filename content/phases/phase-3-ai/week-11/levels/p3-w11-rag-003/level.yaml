        pass
- path: test_main.py
  content: |
    import pytest

    from main import parse_table, row_to_text

    TABLE = """
    | HSN Code | Description        | GST Rate |
    |----------|:-------------------|---------:|
    | 0401     | Fresh milk         | 0%       |
    | 2106     | Namkeen, bhujia    | 12%      |
    """


    def test_parse():
        assert parse_table(TABLE) == [
            {"hsn_code": "0401", "description": "Fresh milk", "gst_rate": "0%"},
            {"hsn_code": "2106", "description": "Namkeen, bhujia", "gst_rate": "12%"},
        ]


    def test_row_to_text():
        row = {"hsn_code": "0401", "description": "Fresh milk", "gst_rate": "0%"}
        assert row_to_text(row) == "hsn_code: 0401; description: Fresh milk; gst_rate: 0%"


    def test_bad_row():
        with pytest.raises(ValueError, match="3"):
            parse_table("a | b\n--|--\n1 | 2 | 3")
checks:
- kind: pytest_passes
  label: All tests pass
  run: pytest -q test_main.py
hints:
- Trim the outer pipes before splitting, or you get empty first and last cells.
- A separator line matches `^[\s|:\-]+$`. Skip it before treating any line as data.
