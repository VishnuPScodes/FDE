id: p3-w11-rag-003
title: Parse a GST rate table into records
phase: 3
week: 11
module: document-parsing
order: 3
difficulty: 2
estimated_minutes: 15
type: code
environment: python
lesson: ../../lessons/01-parsing-and-chunking.md
task: |
  Tables in documents often reach you as pipe-separated text. Turn them into dicts so each
  row can become its own searchable chunk.

  Write `parse_table(text)`:

  - The first non-empty line is the header. Cells are separated by `|`; ignore leading and trailing pipes.
  - Skip separator lines made only of `|`, `-`, `:` and spaces.
  - Strip each cell. Header names become lower case with spaces replaced by `_`.
  - A row with a different number of cells than the header raises `ValueError` with the line number (1-based).

  Then write `row_to_text(row)` that returns `"key: value; key: value"` in header order.
