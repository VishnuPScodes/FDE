- kind: pytest_passes
  label: All tests pass
  run: pytest -q test_main.py
hints:
- Turn query terms and candidate tokens into sets, then `len(terms & words)` counts the overlap.
- Sort by `(-score, retrieval_rank)` so higher scores come first and the original order breaks ties.
