- path: test_main.py
  content: |
    from main import matches, search

    CHUNKS = [
        {"id": "ka-2024", "vector": [1.0, 0.1], "metadata": {"state": "KA", "year": 2024, "lang": "en"}},
        {"id": "mh-2024", "vector": [1.0, 0.0], "metadata": {"state": "MH", "year": 2024, "lang": "en"}},
        {"id": "ka-2021", "vector": [1.0, 0.0], "metadata": {"state": "KA", "year": 2021, "lang": "kn"}},
        {"id": "ka-hi", "vector": [0.2, 1.0], "metadata": {"state": "KA", "year": 2024, "lang": "hi"}},
        {"id": "untagged", "vector": [1.0, 0.0], "metadata": {}},
    ]


    def test_matches():
        assert matches({"state": "KA", "year": 2024}, {"state": "KA"})
        assert matches({"state": "KA"}, {"state": ["KA", "TN"]})
        assert not matches({"state": "MH"}, {"state": ["KA", "TN"]})
        assert not matches({}, {"state": "KA"})


    def test_filtered_search():
        assert search([1.0, 0.0], CHUNKS, 2, {"state": "KA", "year": 2024}) == ["ka-2024", "ka-hi"]


    def test_list_filter():
        assert search([1.0, 0.0], CHUNKS, 3, {"lang": ["hi", "kn"]}) == ["ka-2021", "ka-hi"]


    def test_no_filter():
        assert search([1.0, 0.0], CHUNKS, 3) == ["ka-2021", "mh-2024", "untagged"]
