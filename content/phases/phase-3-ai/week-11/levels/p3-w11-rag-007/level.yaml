task: |
  A Bengaluru support bot must only quote policies for the customer's own state and the
  current year. Filter first, then rank.

  Write `matches(metadata, filters)` and `search(query_vector, chunks, k, filters=None)`.

  - Each chunk is `{"id", "vector", "metadata"}`.
  - A filter value that is a list means "any of these". Any other value means "equal to".
  - A filter key missing from a chunk's metadata means the chunk does not match.
  - `search` returns the top `k` chunk ids by cosine similarity (use the provided `cosine`),
    highest first, ties by id. With no filters, search all chunks.
