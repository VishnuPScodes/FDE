task: |
  Hybrid search runs keyword search and vector search, then merges the two ranked lists.
  Their scores are on different scales, so merge by rank instead.

  Write `rrf(rankings, k=60, top_n=None)`. `rankings` is a list of ranked id lists (best first).
  Each id gets `1 / (k + rank)` from every list it appears in, where `rank` starts at 1.
  Return a list of `(id, score)` sorted by score (highest first, ties by id), scores rounded
  to 6 places, cut to `top_n` if given.

  Count an id only at its first (best) position if it appears twice in one list.
starter_files:
- path: main.py
  content: |
    def rrf(rankings, k=60, top_n=None):
        pass
- path: test_main.py
  content: |
    from main import rrf


    def test_fusion():
        keyword = ["gstr3b#2", "late-fee#0", "itc#5"]
        vector = ["itc#5", "gstr3b#2", "refund#1"]
        assert rrf([keyword, vector]) == [
            ("gstr3b#2", 0.032522),
            ("itc#5", 0.032266),
            ("late-fee#0", 0.016129),
            ("refund#1", 0.015873),
        ]


    def test_top_n_and_small_k():
        assert rrf([["a", "b"], ["b", "a"]], k=1, top_n=1) == [("a", 0.833333)]


    def test_duplicates_in_one_list():
        assert rrf([["a", "a", "b"]], k=0) == [("a", 1.0), ("b", 0.333333)]
