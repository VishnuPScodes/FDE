lesson: ../../lessons/02-retrieval-metrics.md
task: |
  Now run the metrics over the full golden dataset. A `retriever` is a function: question in, ranked list of ids out.

  The metric helpers are already in `main.py`. Write `evaluate_retriever(retriever, rows, k)`:

  - Skip rows whose `relevant_ids` is empty (unanswerable questions have no right chunk to find).
  - For each remaining row, call `retriever(row["question"])` and compute precision@k, recall@k, reciprocal rank and nDCG@k
    (use `ndcg_at_k`, which treats every relevant id as grade 1).
  - Return `{"precision": ..., "recall": ..., "mrr": ..., "ndcg": ..., "n": rows_used}` where each metric is the mean over used rows,
    rounded to 4 places. If no rows are used, every metric is `0.0` and `n` is 0.
starter_files:
- path: main.py
  content: |
    import math


    def precision_at_k(retrieved, relevant, k):
        return round(sum(1 for d in retrieved[:k] if d in relevant) / k, 4)


    def recall_at_k(retrieved, relevant, k):
        return round(sum(1 for d in retrieved[:k] if d in relevant) / len(relevant), 4) if relevant else 0.0


    def reciprocal_rank(retrieved, relevant):
        for i, d in enumerate(retrieved, 1):
            if d in relevant:
                return 1 / i
        return 0.0


    def ndcg_at_k(retrieved, relevant, k):
        dcg = sum(1 / math.log2(i + 2) for i, d in enumerate(retrieved[:k]) if d in relevant)
        ideal = sum(1 / math.log2(i + 2) for i in range(min(k, len(relevant))))
        return dcg / ideal if ideal else 0.0


    def evaluate_retriever(retriever, rows, k):
        pass
- path: test_main.py
  content: |
    from main import evaluate_retriever

    ROWS = [
        {"id": "1", "question": "refund time", "relevant_ids": ["upi#3"]},
        {"id": "2", "question": "cancel order", "relevant_ids": ["ord#1", "ord#2"]},
        {"id": "3", "question": "weather in Pune", "relevant_ids": [], "tags": ["unanswerable"]},
    ]
    RESULTS = {
        "refund time": ["upi#3", "x", "y"],
        "cancel order": ["z", "ord#2", "ord#1"],
        "weather in Pune": ["upi#3", "x", "y"],
    }


    def retriever(q):
        return RESULTS[q]


    def test_means_over_answerable_rows():
        out = evaluate_retriever(retriever, ROWS, 3)
        assert out["n"] == 2
        assert out["precision"] == 0.5     # (1/3 + 2/3) / 2
        assert out["recall"] == 1.0
        assert out["mrr"] == 0.75          # (1 + 1/2) / 2
        assert 0.8 < out["ndcg"] < 0.9


    def test_k_matters():
        out = evaluate_retriever(retriever, ROWS, 1)
        assert out["recall"] == 0.5        # (1.0 + 0) / 2 -> row 2 has none in top 1
        assert out["precision"] == 0.5


    def test_no_rows():
        assert evaluate_retriever(retriever, [ROWS[2]], 3) == {
            "precision": 0.0, "recall": 0.0, "mrr": 0.0, "ndcg": 0.0, "n": 0}
