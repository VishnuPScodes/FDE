- kind: pytest_passes
  label: All tests pass
  run: pytest -q test_main.py
hints:
- 'Filter first: `used = [r for r in rows if r["relevant_ids"]]`. Dividing by `len(rows)` instead of `len(used)` is the classic bug.'
- 'Call the retriever once per row and reuse the result for all four metrics. Convert `relevant_ids` to a `set` for fast lookups.'
