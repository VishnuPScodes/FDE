hints:
- 'Positions start at 0 in `enumerate`, so the discount is `math.log2(i + 2)`.'
- 'The ideal list is `sorted(grades.values(), reverse=True)[:k]`. Divide the actual DCG by the ideal DCG so a perfect ranking scores 1.0.'
