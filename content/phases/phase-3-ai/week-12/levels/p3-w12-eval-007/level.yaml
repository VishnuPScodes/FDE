- path: test_main.py
  content: |
    from main import dcg, ndcg_at_k

    GRADES = {"a": 3, "b": 2, "d": 1}


    def test_dcg():
        assert round(dcg([3, 2, 1]), 4) == 4.7619
        assert dcg([]) == 0


    def test_ndcg_imperfect():
        assert ndcg_at_k(["b", "a", "c"], GRADES, 3) == 0.8175


    def test_ndcg_perfect_and_zero():
        assert ndcg_at_k(["a", "b", "d"], GRADES, 3) == 1.0
        assert ndcg_at_k(["x", "y"], GRADES, 3) == 0.0
        assert ndcg_at_k(["a"], {}, 3) == 0.0


    def test_k_cuts_both_sides():
        # ideal for k=1 is just grade 3 -> 'b' (grade 2) gives 2/3
        assert ndcg_at_k(["b", "a"], GRADES, 1) == 0.6667
