task: |
  Not every relevant chunk is equally good. A chunk with the exact refund rule is worth more than one that only mentions refunds.
  nDCG handles grades (0 = useless, 3 = perfect).

  - `dcg(gains)`: `sum(gain / log2(i + 2))` for `i = 0, 1, 2...` (so the first position is divided by `log2(2) = 1`).
  - `ndcg_at_k(retrieved, grades, k)`: `grades` is a dict `{id: grade}`; ids not in it have grade 0. Take the gains of the top `k`
    retrieved ids, compute `dcg`, then divide by the DCG of the **ideal** order (all grades sorted high to low, top `k`).
    If the ideal DCG is 0, return `0.0`. Round to 4 places.

  Example: grades `{"a":3,"b":2,"d":1}`, retrieved `["b","a","c"]`, k=3 gives 0.8175.
