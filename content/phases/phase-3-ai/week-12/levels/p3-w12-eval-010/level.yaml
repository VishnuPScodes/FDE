task: |
  For open answers ("explain our refund policy") there is no single right string. A second model grades the answer against a rubric.
  That is an LLM-as-judge. You will not call a real model here. You only build the prompt and parse the reply.

  Write `build_judge_prompt(rubric, question, answer)` returning exactly these lines joined by `"\n"`:

  ```
  You are a strict grader. Score the answer from 1 to 5.
  Rubric:
  - <each rubric item on its own line>
  Question: <question>
  Answer: <answer>
  Reply exactly as:
  SCORE: <1-5>
  REASON: <one sentence>
  ```

  Write `parse_judge(raw)`: find `SCORE:` followed by a digit 1 to 5 (case-insensitive, extra spaces allowed). Return
  `{"score": int, "reason": str}`, where `reason` is the text after `REASON:` stripped (or `""` if missing).
  If there is no valid score (for example `SCORE: 9` or no score at all), return `None`.
