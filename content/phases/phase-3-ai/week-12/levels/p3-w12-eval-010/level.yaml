- path: test_main.py
  content: |
    from main import build_judge_prompt, parse_judge


    def test_prompt():
        p = build_judge_prompt(["Mentions T+1", "Polite tone"], "When is my refund?", "Next working day.")
        assert p == (
            "You are a strict grader. Score the answer from 1 to 5.\n"
            "Rubric:\n- Mentions T+1\n- Polite tone\n"
            "Question: When is my refund?\nAnswer: Next working day.\n"
            "Reply exactly as:\nSCORE: <1-5>\nREASON: <one sentence>"
        )


    def test_parse_ok():
        assert parse_judge("SCORE: 4\nREASON: Covers T+1 but is curt.") == {"score": 4, "reason": "Covers T+1 but is curt."}


    def test_parse_loose_format():
        assert parse_judge("Sure!\nscore:   5\nreason: perfect") == {"score": 5, "reason": "perfect"}
        assert parse_judge("SCORE: 3") == {"score": 3, "reason": ""}


    def test_parse_invalid():
        assert parse_judge("SCORE: 9\nREASON: x") is None
        assert parse_judge("I think it is good.") is None
        assert parse_judge("SCORE: 12") is None
