- path: main.py
  content: |
    def reciprocal_rank(retrieved, relevant):
        pass


    def mrr(runs):
        pass
- path: test_main.py
  content: |
    from main import reciprocal_rank, mrr


    def test_rr():
        assert reciprocal_rank(["x", "a", "b"], {"a", "b"}) == 0.5
        assert reciprocal_rank(["a"], {"a"}) == 1.0
        assert reciprocal_rank(["x", "y"], {"a"}) == 0.0
        assert reciprocal_rank([], {"a"}) == 0.0


    def test_uses_first_hit_not_last():
        assert reciprocal_rank(["x", "y", "a", "b"], {"a", "b"}) == 1 / 3


    def test_mrr():
        runs = [(["a"], {"a"}), (["x", "y", "a"], {"a"}), (["x"], {"a"})]
        assert mrr(runs) == 0.4444
        assert mrr([]) == 0.0
