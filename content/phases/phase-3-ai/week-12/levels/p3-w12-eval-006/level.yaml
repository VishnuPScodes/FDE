task: |
  Sometimes only the first good result matters, like the answer a chatbot shows first. Reciprocal rank captures that.

  - `reciprocal_rank(retrieved, relevant)`: find the 1-based rank of the **first** relevant id. Return `1 / rank`. If none is found, return `0.0`.
  - `mrr(runs)`: `runs` is a list of `(retrieved, relevant)` pairs. Return the mean reciprocal rank rounded to 4 places, or `0.0` for an empty list.

  Example: first hit at rank 1, 3 and none gives (1 + 1/3 + 0) / 3 = 0.4444.
