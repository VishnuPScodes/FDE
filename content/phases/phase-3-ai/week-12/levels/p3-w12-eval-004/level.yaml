- path: test_main.py
  content: |
    from main import dataset_version, diff_versions

    A = {"id": "a", "question": "q1", "relevant_ids": ["x#1"]}
    B = {"id": "b", "question": "q2", "relevant_ids": ["y#2"]}


    def test_version_shape_and_order_independence():
        v = dataset_version([A, B])
        assert len(v) == 12 and all(c in "0123456789abcdef" for c in v)
        assert dataset_version([B, A]) == v
        reordered = {"relevant_ids": ["x#1"], "question": "q1", "id": "a"}
        assert dataset_version([reordered, B]) == v


    def test_version_changes_on_edit():
        edited = dict(A, question="q1 changed")
        assert dataset_version([edited, B]) != dataset_version([A, B])


    def test_diff():
        new = [dict(A, question="edited"), {"id": "c", "question": "q3", "relevant_ids": []}]
        assert diff_versions([A, B], new) == {"added": ["c"], "removed": ["b"], "changed": ["a"]}
        assert diff_versions([A], [A]) == {"added": [], "removed": [], "changed": []}
