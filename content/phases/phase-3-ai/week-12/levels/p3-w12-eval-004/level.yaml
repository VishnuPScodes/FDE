hints:
- 'Without `sort_keys=True` and a sort by id, the same data can hash differently. That makes version numbers useless.'
- 'Index both lists by id: `{r["id"]: r for r in rows}`. Then dict key sets (`-` and `&`) give added, removed and common ids.'
