task: |
  When a score changes, you must know whether the model changed or the dataset changed. So version the dataset.

  Write two functions:

  - `dataset_version(rows)`: return the first 12 hex characters of the SHA-256 of a canonical JSON string. Sort rows by `id`,
    then dump the list with `json.dumps(sorted_rows, sort_keys=True, separators=(",", ":"))`. Encode as UTF-8.
    Row order and key order must **not** change the result.
  - `diff_versions(old, new)`: both are lists of rows. Return `{"added": [...], "removed": [...], "changed": [...]}` with
    sorted ids. `changed` means the id is in both but the rows are not equal.
