lesson: ../../lessons/03-llm-as-judge.md
task: |
  Before you trust a judge, compare it with a human on the same answers. Raw agreement is misleading: two graders who both
  say "pass" 90 percent of the time will agree a lot by luck. Cohen's kappa removes the luck.

  Write `cohen_kappa(a, b)` for two equal-length lists of labels:

  - `po` = fraction of positions where `a[i] == b[i]`.
  - `pe` = sum over every label of `(share of label in a) * (share of label in b)`.
  - `kappa = (po - pe) / (1 - pe)`, rounded to 4 places. If `pe == 1`, return `1.0`.

  Also write `agreement_label(kappa)`: below 0.2 (including negatives) is `"slight"`, below 0.4 `"fair"`, below 0.6 `"moderate"`,
  below 0.8 `"substantial"`, otherwise `"almost perfect"`.
