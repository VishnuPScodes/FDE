id: p3-w13-agent-005
title: Build the agent loop with a step limit
phase: 3
week: 13
module: agent-loops
order: 5
difficulty: 3
estimated_minutes: 30
type: code
environment: python
lesson: ../../lessons/02-agent-loops.md
task: |
  Build the core loop of a claims assistant. `fake_llm.py` stands in for the model, so the tests are the same every run. Read its docstring for the message shapes.

  Write `run_agent(llm, user_message, registry, max_steps=5)` in `agent.py`:

  1. Start with `[{"role": "system", "content": SYSTEM}, {"role": "user", "content": user_message}]`.
  2. Each step, call `llm.complete(messages, tools=specs)`. `specs` is a list of `{"name", "description", "input_schema"}` built from the registry (registry entries have `description`, `schema` and `fn`).
  3. Append the reply as `{"role": "assistant", "content": ..., "tool_calls": ...}`.
  4. If there are no tool calls, return `{"answer": content, "stopped": "answer", "steps": step, "messages": messages}`.
  5. Otherwise run every tool call with `dispatch()` from `dispatcher.py` and append each tool message. Then loop.
  6. After `max_steps` model calls with no answer, return `{"answer": None, "stopped": "max_steps", "steps": max_steps, "messages": messages}`.
starter_files:
  - path: agent.py
  - path: dispatcher.py
  - path: schema_check.py
  - path: fake_llm.py
  - path: test_agent.py
checks:
  - kind: pytest_passes
    run: pytest -q test_agent.py
    label: Agent loop tests pass
hints:
  - "Use `for step in range(1, max_steps + 1):` instead of `while True`. A loop without a limit can spend money forever."
  - The model must see its own tool request before the tool result. Append the assistant message first, then the tool messages.
  - "Build specs once: `[{\"name\": name, \"description\": t[\"description\"], \"input_schema\": t[\"schema\"]} for name, t in registry.items()]`."
feedback:
  - when: { stdout_contains: "script ran out" }
    message: Your loop called the model too many times. Stop when `max_steps` is reached or the reply has no tool calls.
solution: solution/
unlocks: [p3-w13-agent-006]
tags: [agents, agent-loop, insurance]
