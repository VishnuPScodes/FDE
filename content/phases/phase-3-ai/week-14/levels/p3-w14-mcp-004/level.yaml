id: p3-w14-mcp-004
title: Offer reusable prompts from your MCP server
phase: 3
week: 14
module: mcp-servers
order: 4
difficulty: 3
estimated_minutes: 25
type: code
environment: python
lesson: ../../lessons/01-mcp-servers.md
task: |
  MCP prompts are templates a user can pick in their AI client, like "Summarise a claim". `server.py` now has a `PROMPTS` dict.

  Add two methods to `handle()`:

  - `prompts/list`: result `{"prompts": [{"name", "description", "arguments"}, ...]}`. Leave out `template` and `defaults`.
  - `prompts/get` with `params` `{"name": ..., "arguments": {...}}`. Check in this order, each an error with code `-32602`:
    1. Unknown prompt: `"Unknown prompt: <name>"`.
    2. An argument the prompt does not declare: `"Unknown argument: <key>"`.
    3. An argument value that is not a string: `"Argument <key> must be a string"`.
    4. A required argument is missing: `"Missing required argument: <name>"`.

    Then fill the template with `defaults` overridden by the given arguments, using `str.format`. Return `{"description": ..., "messages": [{"role": "user", "content": {"type": "text", "text": ...}}]}`.

  Argument values are user input. A value like `"{language}"` must appear as-is, not be expanded.
starter_files:
  - path: server.py
  - path: mcp_host.py
  - path: schema_check.py
  - path: test_server.py
checks:
  - kind: pytest_passes
    run: pytest -q test_server.py
    label: MCP prompt tests pass
hints:
  - "Merge dicts with `{**prompt[\"defaults\"], **given}` so given values win."
  - "`template.format(**values)` reads placeholders only from the template. Text inside the values is never re-parsed."
  - Validate everything before you build the text. Return the first error you find.
solution: solution/
