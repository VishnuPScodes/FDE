task: |
  You extract GST invoice fields with a model. Models sometimes return broken JSON
  or miss a field. Never pass that downstream.

  Write `extract_invoice(client, invoice_text, max_attempts=3)`:

  - Call `client.complete(prompt)` which returns a string.
  - The reply must be a JSON object with `invoice_number` (str), `gstin` (str, exactly 15 characters)
    and `total_inr` (int or float, not bool).
  - Strip a ```json code fence if the model wrapped its reply in one.
  - If the reply is invalid, call again. The new prompt must be the original prompt plus
    `"\n\nYour last reply was invalid: <reason>. Reply with JSON only."`
  - Return the parsed dict on success. After `max_attempts` invalid replies, raise `ValueError`.

  Use `build_prompt(invoice_text)` (provided) for the first prompt.
