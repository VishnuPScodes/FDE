- path: test_main.py
  content: |
    import pytest

    from main import build_prompt, extract_invoice

    GOOD = '{"invoice_number": "INV-2024-118", "gstin": "29ABCDE1234F1Z5", "total_inr": 11800}'


    class FakeClient:
        def __init__(self, replies):
            self.replies = list(replies)
            self.prompts = []

        def complete(self, prompt):
            self.prompts.append(prompt)
            return self.replies.pop(0)


    def test_first_reply_valid():
        client = FakeClient([GOOD])
        assert extract_invoice(client, "Invoice text")["total_inr"] == 11800
        assert len(client.prompts) == 1


    def test_code_fence_is_stripped():
        client = FakeClient(["```json\n" + GOOD + "\n```"])
        assert extract_invoice(client, "x")["gstin"] == "29ABCDE1234F1Z5"


    def test_retries_with_reason():
        client = FakeClient(["Sure! Here it is:", '{"invoice_number": "A", "gstin": "SHORT", "total_inr": 5}', GOOD])
        result = extract_invoice(client, "Invoice 118")
        assert result["invoice_number"] == "INV-2024-118"
        assert len(client.prompts) == 3
        assert client.prompts[1].startswith(build_prompt("Invoice 118"))
        assert "Your last reply was invalid:" in client.prompts[1]
        assert "gstin" in client.prompts[2]


    def test_bool_total_is_invalid():
        bad = '{"invoice_number": "A", "gstin": "29ABCDE1234F1Z5", "total_inr": true}'
        with pytest.raises(ValueError):
            extract_invoice(FakeClient([bad, bad]), "x", max_attempts=2)


    def test_gives_up():
        client = FakeClient(["nope"] * 3)
        with pytest.raises(ValueError):
            extract_invoice(client, "x")
        assert len(client.prompts) == 3
