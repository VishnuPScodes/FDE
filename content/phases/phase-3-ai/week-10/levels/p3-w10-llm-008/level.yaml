hints:
- Write `validate(data)` first. Return a short reason string for each problem and `None` when all is well.
- '`isinstance(True, int)` is `True` in Python. Check for `bool` before checking for numbers.'
- Build every retry prompt from the original prompt, not from the previous retry prompt, so reasons do not pile up.
