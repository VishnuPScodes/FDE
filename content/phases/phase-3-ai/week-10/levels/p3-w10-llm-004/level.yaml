lesson: ../../lessons/02-sampling-temperature-top-p.md
task: |
  A model scores every possible next token with a number called a logit.
  Sampling turns those logits into probabilities.

  Write `softmax(logits, temperature)`. `logits` is a dict like `{"refund": 2.0, "sorry": 1.0}`.
  Return a dict of probabilities, each rounded to 4 decimal places.

  - Divide each logit by `temperature` before applying softmax.
  - Subtract the largest scaled logit before `math.exp` so big numbers do not overflow.
  - `temperature == 0` means greedy: the top token gets 1.0 and every other token 0.0.
    If two tokens tie for the top, the one that sorts first alphabetically wins.
  - A negative temperature raises `ValueError`.
