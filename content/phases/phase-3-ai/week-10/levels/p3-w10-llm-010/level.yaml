        pass
- path: test_main.py
  content: |
    import json

    import pytest

    from main import build_batch, match_results

    TICKETS = [
        {"id": 101, "text": "Parcel stuck in Kochi hub for 4 days"},
        {"id": 102, "text": "   "},
        {"id": 103, "text": "डिलीवरी बॉय ने पैसे ज़्यादा मांगे"},
    ]


    def test_build_batch_lines():
        lines = build_batch(TICKETS, "claude-haiku-5-5", "Tag the complaint.").split("\n")
        assert len(lines) == 2
        first = json.loads(lines[0])
        assert first["custom_id"] == "ticket-101"
        assert first["params"]["messages"] == [{"role": "user", "content": "Parcel stuck in Kochi hub for 4 days"}]
        assert first["params"]["max_tokens"] == 200
        assert "डिलीवरी" in lines[1]


    def test_duplicate_ids():
        with pytest.raises(ValueError):
            build_batch([{"id": 1, "text": "a"}, {"id": 1, "text": "b"}], "m", "s")


    def test_match_results_out_of_order():
        results = "\n".join([
            json.dumps({"custom_id": "ticket-103", "result": {"type": "succeeded", "message": {"content": [{"type": "text", "text": "overcharge"}]}}}),
            json.dumps({"custom_id": "ticket-101", "result": {"type": "errored", "error": {"type": "overloaded"}}}),
        ])
        assert match_results(TICKETS, results) == {101: None, 102: None, 103: "overcharge"}
checks:
- kind: pytest_passes
  label: All tests pass
  run: pytest -q test_main.py
hints:
- Key results by `custom_id`, never by position. The batch service does not keep your order.
- Start the output from the `tickets` list so skipped and failed tickets still show up as `None`.
