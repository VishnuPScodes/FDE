id: p3-w10-llm-010
title: Build a batch request file and match results
phase: 3
week: 10
module: api-patterns
order: 10
difficulty: 3
estimated_minutes: 20
type: code
environment: python
lesson: ../../lessons/04-caching-and-batches.md
task: |
  Overnight, a Kerala logistics company wants 5,000 delivery complaints tagged.
  Batch APIs are about half price but return results in **any order**.

  Write:

  - `build_batch(tickets, model, system, max_tokens=200)` returns a JSONL string, one line per ticket:
    `{"custom_id": "ticket-<id>", "params": {"model": ..., "max_tokens": ..., "system": ..., "messages": [{"role": "user", "content": <text>}]}}`.
    Skip tickets whose text is blank. Raise `ValueError` on a duplicate ticket id.
    Use `json.dumps(line, ensure_ascii=False)` for each line and join with `"\n"`.
  - `match_results(tickets, results_jsonl)` returns a dict `{ticket_id: text_or_None}`.
    Each result line has `custom_id` and `result`. A succeeded result looks like
    `{"type": "succeeded", "message": {"content": [{"type": "text", "text": "..."}]}}`.
    Any other type maps to `None`. Every ticket id from `tickets` must appear in the output.
starter_files:
- path: main.py
  content: |
    import json


    def build_batch(tickets, model, system, max_tokens=200):
        pass


