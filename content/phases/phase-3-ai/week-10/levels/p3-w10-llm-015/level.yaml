- path: test_main.py
  content: |
    import json

    import pytest

    from main import assemble_tool_calls


    def piece(index, arguments="", id=None, name=None):
        call = {"index": index, "function": {"arguments": arguments}}
        if id:
            call["id"] = id
            call["function"]["name"] = name
        return "data: " + json.dumps({"choices": [{"delta": {"tool_calls": [call]}}]})


    def test_one_call_in_pieces():
        lines = [
            'data: {"choices":[{"delta":{"role":"assistant"}}]}',
            piece(0, "", id="call_1", name="get_order"),
            piece(0, '{"order_'),
            ": keep-alive",
            piece(0, 'id": "OD-1'),
            "",
            piece(0, '42"}'),
            "data: [DONE]",
        ]
        assert assemble_tool_calls(lines) == [
            {"id": "call_1", "name": "get_order", "arguments": {"order_id": "OD-142"}}
        ]


    def test_parallel_calls_with_mixed_pieces():
        lines = [
            piece(0, "", id="call_a", name="get_order"),
            piece(1, "", id="call_b", name="get_refund"),
            piece(1, '{"refund_id": '),
            piece(0, '{"order_id": '),
            piece(0, '"OD-7"}'),
            piece(1, '"RF-9"}'),
            "data: [DONE]",
        ]
        assert assemble_tool_calls(lines) == [
            {"id": "call_a", "name": "get_order", "arguments": {"order_id": "OD-7"}},
            {"id": "call_b", "name": "get_refund", "arguments": {"refund_id": "RF-9"}},
        ]


    def test_sorted_by_index_not_arrival():
        lines = [piece(1, "{}", id="call_b", name="second"), piece(0, "{}", id="call_a", name="first"), "data: [DONE]"]
        assert [c["name"] for c in assemble_tool_calls(lines)] == ["first", "second"]


    def test_empty_arguments_mean_empty_dict():
        lines = [piece(0, "", id="call_1", name="list_open_tickets"), "data: [DONE]"]
        assert assemble_tool_calls(lines) == [{"id": "call_1", "name": "list_open_tickets", "arguments": {}}]


    def test_plain_text_reply_has_no_tool_calls():
        lines = ['data: {"choices":[{"delta":{"content":"Hello"}}]}', "data: [DONE]"]
        assert assemble_tool_calls(lines) == []


    def test_lines_after_done_are_ignored():
        lines = [piece(0, "{}", id="call_1", name="ping"), "data: [DONE]", piece(0, "junk")]
        assert assemble_tool_calls(lines)[0]["arguments"] == {}


    def test_cut_off_arguments_raise():
        lines = [piece(0, "", id="call_1", name="get_order"), piece(0, '{"order_id": "OD-')]
        with pytest.raises(ValueError, match="get_order"):
            assemble_tool_calls(lines)
checks:
- kind: pytest_passes
  label: All tests pass
  run: pytest -q test_main.py
hints:
- 'Keep a dict from `index` to `{"id": ..., "name": ..., "parts": []}`. Use `setdefault` so the first piece creates the entry.'
- Only set `id` and `name` when a piece actually has them. Later pieces leave them out.
- Join the parts with `"".join(...)`, then wrap `json.loads` in `try/except json.JSONDecodeError` and raise `ValueError` from it.
