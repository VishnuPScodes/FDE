task: |
  Your support bot streams its replies. When the model decides to call tools, the tool calls stream too, and the JSON arguments arrive in pieces. The model can also call two tools at once, and their pieces can arrive mixed together.

  Each useful SSE line looks like
  `data: {"choices":[{"delta":{"tool_calls":[{"index":0,"id":"call_1","function":{"name":"get_order","arguments":"{\"order"}}]}}]}`.

  Write `assemble_tool_calls(lines)` that returns the finished tool calls:

  - Use the same line rules as before. Skip blank lines, lines that start with `:`, and lines that do not start with `data:`. Stop at `data: [DONE]`.
  - Each chunk may have a list at `choices[0].delta.tool_calls`. Each item has an `index`. Group the pieces by `index`, not by arrival order.
  - The first piece for an index carries `id` and `function.name`. Later pieces usually carry only `function.arguments`, a piece of text. Join these pieces in the order they arrive.
  - Return a list sorted by `index`. Each item is `{"id": str, "name": str, "arguments": dict}`, where `arguments` is the joined text parsed with `json.loads`. Joined text that is empty means `{}`.
  - If the joined arguments are not valid JSON (for example, the stream was cut off), raise `ValueError` with a message that includes the tool name.
