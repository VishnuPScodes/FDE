lesson: ../../lessons/01-tokens-context-and-cost.md
task: |
  A Bengaluru fintech wants to know what one support-bot reply costs.

  In `main.py`, write two functions:

  - `estimate_tokens(text)` returns the token estimate using the rule of thumb of
    about 4 characters per token, rounded **up**. Empty text is 0 tokens.
  - `call_cost_inr(input_tokens, output_tokens, input_usd_per_m, output_usd_per_m, inr_per_usd)`
    returns the cost of one call in rupees, rounded to 4 decimal places.
    Prices are in US dollars per one million tokens.

  Run `pytest -q test_main.py` until it passes.
starter_files:
- path: main.py
  content: |
    import math


    def estimate_tokens(text):
        # About 4 characters per token, rounded up.
        pass


    def call_cost_inr(input_tokens, output_tokens, input_usd_per_m, output_usd_per_m, inr_per_usd):
        # Prices are per one million tokens. Return rupees rounded to 4 places.
        pass
- path: test_main.py
  content: |
    from main import call_cost_inr, estimate_tokens


    def test_empty_text_is_zero_tokens():
        assert estimate_tokens("") == 0


    def test_tokens_round_up():
        assert estimate_tokens("UPI refund") == 3  # 10 chars -> 2.5 -> 3
        assert estimate_tokens("abcd") == 1


    def test_cost_of_one_reply():
        # 1,200 input + 300 output tokens at $0.10 / $0.50 per million, ₹88 per $
        assert call_cost_inr(1200, 300, 0.10, 0.50, 88) == 0.0238


    def test_free_tier_costs_nothing():
        assert call_cost_inr(5000, 500, 0, 0, 88) == 0
checks:
- kind: pytest_passes
  label: All tests pass
  run: pytest -q test_main.py
hints:
- '`math.ceil(len(text) / 4)` rounds up. Floor division `//` rounds down and undercounts.'
- Input and output tokens have different prices. Multiply each by its own price, add, then divide by 1,000,000.
