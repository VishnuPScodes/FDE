  - "`min(eligible, key=lambda m: (m[\"inr_per_call\"], m[\"name\"]))` handles the cost and the alphabetical tie in one line."
  - "Check the budget last, after you have chosen a model. Return `None` rather than a cheaper model that cannot do the job."
