  - path: test_main.py
    content: |
      import pytest

      from main import PRICES, call_cost_inr, cost_report


      def test_simple_call():
          usage = {"input_tokens": 1_000_000, "output_tokens": 1_000_000}
          # small: $0.25 + $1.25 = $1.50 -> 124.5 rupees
          assert call_cost_inr("small", usage, PRICES) == 124.5


      def test_small_call_is_rounded_to_four_places():
          usage = {"input_tokens": 1200, "output_tokens": 300}
          # (1200*0.25 + 300*1.25) / 1e6 = 0.000675 USD -> 0.056025 INR
          assert call_cost_inr("small", usage, PRICES) == 0.056


      def test_cached_tokens_cost_ten_percent():
          usage = {"input_tokens": 10_000, "output_tokens": 0, "cached_input_tokens": 8_000}
          # uncached 2000*3 + cached 8000*0.3 = 6000 + 2400 = 8400 -> 0.0084 USD -> 0.6972 INR
          assert call_cost_inr("large", usage, PRICES) == 0.6972


      def test_custom_exchange_rate():
          usage = {"input_tokens": 1_000_000, "output_tokens": 0}
          assert call_cost_inr("large", usage, PRICES, usd_inr=90.0) == 270.0


      def test_unknown_model():
          with pytest.raises(KeyError):
              call_cost_inr("huge", {"input_tokens": 1, "output_tokens": 1}, PRICES)


      def test_report_sums_unrounded_costs():
          calls = [{"model": "small", "usage": {"input_tokens": 1200, "output_tokens": 300}} for _ in range(3)]
          calls.append({"model": "large", "usage": {"input_tokens": 1_000_000, "output_tokens": 100_000}})
          report = cost_report(calls, PRICES)
          # small: 3 * 0.056025 = 0.168075 ; large: (3.0 + 1.5) * 83 = 373.5
          assert report == {"total_inr": 373.6681, "by_model": {"small": 0.1681, "large": 373.5}}


      def test_empty_report():
          assert cost_report([], PRICES) == {"total_inr": 0.0, "by_model": {}}
checks:
  - kind: pytest_passes
    label: All tests pass
    run: pytest -q test_main.py
hints:
  - "Prices are per **million** tokens, so divide token counts by 1,000,000 after multiplying."
  - "Split the input: `fresh = input_tokens - cached`. Fresh tokens pay full price, cached tokens pay `price * 0.1`."
  - "In the report, keep a running total per model without rounding, and round only when you build the final dict."
