task: |
  Finance will ask "what did the chatbot cost us this week, in rupees?" Your traces already hold token counts. Now turn them into money.

  Prices are in US dollars per **one million** tokens:

  ```python
  PRICES = {
      "small": {"input": 0.25, "output": 1.25},
      "large": {"input": 3.00, "output": 15.00},
  }
  ```

  Write `call_cost_inr(model, usage, prices, usd_inr=83.0)`. `usage` has `input_tokens`, `output_tokens` and optionally `cached_input_tokens` (default 0). Cached tokens are **part of** `input_tokens` and are billed at 10% of the input price. Return the cost in rupees, rounded to 4 places. An unknown model raises `KeyError`.

  Write `cost_report(calls, prices, usd_inr=83.0)`. `calls` is a list of `{"model": ..., "usage": {...}}`. Return `{"total_inr": ..., "by_model": {model: inr}}`. Add up the **unrounded** costs, then round each number to 4 places at the end. `by_model` has only models that appeared.
