lesson: ../../lessons/02-cost-and-latency.md
task: |
  An average hides pain. If 19 users wait 1 second and one waits 30 seconds, the average looks fine. Teams watch **percentiles**: p95 means "95% of requests were faster than this".

  Write `percentile(values, p)` using the **nearest-rank** method: sort the values, take `rank = ceil(p / 100 * n)` (at least 1), and return the value at that rank (1-based). Return `None` for an empty list.

  Write `latency_summary(ms_values)`. Return a dict with `count`, `mean` (rounded to 1 place), `p50`, `p95` and `max`. For an empty list return `{"count": 0, "mean": None, "p50": None, "p95": None, "max": None}`.

  Write `slo_ok(ms_values, p95_limit_ms)`. It returns `True` when the p95 is at or below the limit. An empty list is `True` (nothing was slow).
