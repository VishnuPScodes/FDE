  - path: test_main.py
    content: |
      import hashlib

      import pytest

      from main import fingerprint, render


      def test_fills_holes_and_converts_numbers():
          out = render("Hi {name}, your EMI of Rs {amount} is due on {day}.", {"name": "Meera", "amount": 4500, "day": "5th"})
          assert out == "Hi Meera, your EMI of Rs 4500 is due on 5th."


      def test_repeated_hole_and_extra_variables():
          assert render("{x}-{x}", {"x": "a", "unused": 1}) == "a-a"


      def test_missing_variables_raise_with_sorted_unique_names():
          with pytest.raises(KeyError) as info:
              render("{b} {a} {b} {c}", {"c": 1})
          assert "missing: a, b" in str(info.value)


      def test_lookalikes_are_untouched():
          template = 'Reply as JSON like {"a": 1}. Keep {Name} and {} and { x } as they are. Hello {who}.'
          assert render(template, {"who": "Ravi"}) == 'Reply as JSON like {"a": 1}. Keep {Name} and {} and { x } as they are. Hello Ravi.'


      def test_values_are_not_expanded_again():
          assert render("Q: {question}", {"question": "what is {secret}?", "secret": "hunter2"}) == "Q: what is {secret}?"


      def test_fingerprint():
          expected = hashlib.sha256(b"Answer from context.").hexdigest()[:8]
          assert fingerprint("  Answer from context.\n") == expected
          assert len(fingerprint("x")) == 8
          assert fingerprint("a") != fingerprint("b")
checks:
  - kind: pytest_passes
    label: All tests pass
    run: pytest -q test_main.py
hints:
