id: p3-w15-ops-011
title: "Fill a prompt template safely"
phase: 3
week: 15
module: prompt-versioning
order: 3
difficulty: 3
estimated_minutes: 25
type: code
environment: python
lesson: ../../lessons/03-prompt-versioning.md
task: |
  A prompt template has holes like `{name}` and `{amount}`. If one is left empty, the model may see the literal text `{amount}` and make something up. Fill holes strictly, and give each prompt a short fingerprint so traces can say which exact text ran.

  Write `render(template, variables)`:

  - A hole is `{` + a name + `}` where the name matches `[a-z_][a-z0-9_]*`. Use `re.sub` with the pattern `\{([a-z_][a-z0-9_]*)\}`.
  - Replace each hole with `str(variables[name])`.
  - If any holes have no value, raise `KeyError` with the message `"missing: a, b"` (names sorted, without repeats), and do not return a half-filled prompt.
  - Extra variables are ignored.
  - Text that only looks like a hole is left alone, for example JSON such as `{"a": 1}` or `{Name}`.
  - Substitution happens once. If a value itself contains `{other}`, it is **not** filled again.

  Write `fingerprint(template)`: the first 8 hex characters of the SHA-256 of `template.strip()` encoded as UTF-8.
