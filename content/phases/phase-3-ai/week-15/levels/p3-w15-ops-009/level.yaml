id: p3-w15-ops-009
title: "Keep prompts in a versioned registry"
phase: 3
week: 15
module: prompt-versioning
order: 1
difficulty: 2
estimated_minutes: 20
type: code
environment: python
lesson: ../../lessons/03-prompt-versioning.md
task: |
  A prompt is code. If someone edits it in a chat window and nobody knows what changed, you cannot explain why answers got worse. Keep every prompt in a **registry** with version numbers.

  Write `class PromptRegistry`:

  - `register(name, template)` stores a new version and returns its version number. Versions start at 1 for each prompt name and go up by 1.
  - If `template` is exactly the same text as the latest version of that name, do not create a new version. Return the existing latest number.
  - `get(name, version=None)` returns the template text. With no version, return the latest. Unknown name or a version that does not exist raises `KeyError`.
  - `latest_version(name)` returns the latest number. Unknown name raises `KeyError`.
  - `history(name)` returns a list of `{"version": n, "template": text}`, oldest first. Unknown name raises `KeyError`.

  Old versions are never changed or deleted.
