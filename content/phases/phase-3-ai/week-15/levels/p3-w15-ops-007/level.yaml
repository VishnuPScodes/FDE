  - path: test_main.py
    content: |
      import pytest

      from main import CachedLLM


      class FakeLLM:
          def __init__(self):
              self.calls = []

          def __call__(self, model, prompt):
              self.calls.append((model, prompt))
              return f"{model}:{len(self.calls)}"


      def test_second_identical_question_is_free():
          llm = FakeLLM()
          cache = CachedLLM(llm)
          assert cache.ask("small", "What is my IFSC?") == {"text": "small:1", "cached": False}
          assert cache.ask("small", "What is my IFSC?") == {"text": "small:1", "cached": True}
          assert len(llm.calls) == 1
          assert (cache.hits, cache.misses) == (1, 1)
          assert cache.hit_rate() == 0.5


      def test_whitespace_is_normalised_but_case_and_model_are_not():
          llm = FakeLLM()
          cache = CachedLLM(llm)
          cache.ask("small", "hello   there")
          assert cache.ask("small", " hello there\n")["cached"] is True
          assert cache.ask("small", "Hello there")["cached"] is False
          assert cache.ask("large", "hello there")["cached"] is False
          assert len(llm.calls) == 3


      def test_least_recently_used_is_evicted():
          llm = FakeLLM()
          cache = CachedLLM(llm, capacity=2)
          cache.ask("m", "a")
          cache.ask("m", "b")
          cache.ask("m", "a")          # a is now the most recent
          cache.ask("m", "c")          # evicts b
          assert cache.ask("m", "a")["cached"] is True
          assert cache.ask("m", "b")["cached"] is False


      def test_hit_rate_with_no_calls():
          assert CachedLLM(FakeLLM()).hit_rate() == 0.0


      def test_failures_are_not_cached():
          state = {"fail": True}

          def flaky(model, prompt):
              if state["fail"]:
                  raise TimeoutError("slow")
              return "fine"

          cache = CachedLLM(flaky)
          with pytest.raises(TimeoutError):
              cache.ask("m", "q")
          state["fail"] = False
          assert cache.ask("m", "q") == {"text": "fine", "cached": False}
          assert (cache.hits, cache.misses) == (0, 1)
checks:
  - kind: pytest_passes
    label: All tests pass
    run: pytest -q test_main.py
hints:
  - "`collections.OrderedDict` remembers order. `move_to_end(key)` marks a key as most recent; `popitem(last=False)` removes the oldest."
  - "Build the key from both the model and `\" \".join(prompt.split())`. Joining with a separator like `\"\\0\"` avoids two different pairs making the same key."
  - "Call `self.llm(...)` first and only update the store and counters after it returns, so a failed call leaves no trace."
