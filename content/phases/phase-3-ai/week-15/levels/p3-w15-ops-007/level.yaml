environment: python
lesson: ../../lessons/02-cost-and-latency.md
task: |
  A bank chatbot gets "What is my IFSC code?" hundreds of times a day. Paying for the same answer again and again is waste. Write a small cache around the LLM.

  Write `class CachedLLM` with `__init__(self, llm, capacity=100)`. `llm(model, prompt)` returns a string and costs money, so call it as little as possible.

  `ask(model, prompt)` returns `{"text": ..., "cached": bool}`.

  - The cache key is the model plus the prompt with whitespace normalised: `" ".join(prompt.split())`. So `"hello   there"` and `" hello there "` share an entry. A different model is a different entry. Case still matters.
  - On a hit, return the stored text with `cached: True` and do not call `llm`.
  - On a miss, call `llm`, store the text, and return `cached: False`.
  - The cache holds at most `capacity` entries. When it is full, drop the **least recently used** entry. A hit counts as a use.
  - `hits` and `misses` are counters on the object. `hit_rate()` returns `hits / (hits + misses)` rounded to 4 places, or `0.0` if nothing was asked.
  - If `llm` raises, nothing is stored and the error propagates (and it does not count as a miss or a hit).
