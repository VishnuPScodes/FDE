id: p2-w07-ci-008
title: "Build, push and deploy an image"
phase: 2
week: 7
module: github-actions-cicd
order: 23
difficulty: 3
estimated_minutes: 20
type: console
environment: ci
lesson: ../../lessons/05-github-actions-pipelines.md
task: "The deploy job needs image 1.5.0 in the registry, but the build job does not push it. Log in to ghcr.io with the REGISTRY_USER and REGISTRY_TOKEN secrets, set push to true, and let the pipeline deploy 1.5.0 to staging."
starter_files:
  - path: "app.py"
    content: "def order_total(price, qty):\n    return price * qty\n\n\ndef apply_discount(price, percent):\n    return price - price * percent / 100\n"
  - path: "test_app.py"
    content: "from app import apply_discount, order_total\n\n\ndef test_order_total():\n    assert order_total(250, 3) == 750\n\n\ndef test_apply_discount():\n    assert apply_discount(200, 10) == 180\n"
  - path: "requirements.txt"
    content: "pytest==8.3.3\nruff==0.7.4\n"
  - path: "README.md"
    content: "# orders-api\n\nOrder service for Acme Pay.\n"
  - path: "Dockerfile"
    content: "FROM python:3.12-slim\nWORKDIR /app\nCOPY . .\nCMD [\"python\", \"app.py\"]\n"
  - path: "scripts/deploy.sh"
    content: "#!/usr/bin/env bash\n# Simulated deploy helper.\n# Usage: scripts/deploy.sh <staging|production> <version|--rollback>\n"
  - path: ".ci/world.json"
    content: "{\"registryVersions\": [\"1.3.0\", \"1.4.0\"]}"
  - path: ".github/workflows/deploy.yml"
    content: "name: Deploy\non:\n  push:\n    branches: [main]\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: docker/build-push-action@v6\n        with:\n          context: .\n          push: false\n          tags: ghcr.io/acme-pay/orders-api:1.5.0\n  deploy-staging:\n    needs: build\n    runs-on: ubuntu-latest\n    environment: staging\n    steps:\n      - uses: actions/checkout@v4\n      - run: bash scripts/deploy.sh staging 1.5.0\n        env:\n          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}\n"
checks:
  - {"kind": "sim_state", "path": "runs", "contains": "Deploy push main completed/success", "label": "The pipeline succeeded"}
  - {"kind": "sim_state", "path": "registry", "contains": "ghcr.io/acme-pay/orders-api:1.5.0", "label": "Image 1.5.0 is in the registry"}
  - {"kind": "sim_state", "path": "environments", "contains": "staging current=1.5.0 health=healthy", "label": "Staging is healthy on 1.5.0"}
hints:
  - "Pushing an image needs a login first. Look at docker/login-action@v3."
  - "Add a login step before the build step with registry, username and password taken from secrets."
  - "In build-push-action set push: true so the tag is uploaded to the registry."
solution: solution/
unlocks: [p2-w07-ci-009]
tags: ["ci", "docker", "deploy"]
