id: p2-w07-ci-002
title: "Choose the right triggers"
phase: 2
week: 7
module: github-actions-cicd
order: 17
difficulty: 2
estimated_minutes: 15
type: console
environment: ci
lesson: ../../lessons/05-github-actions-pipelines.md
task: "Right now the workflow runs on every push to any branch. Change the triggers so it runs on pushes to main and on pull requests into main only. Then run: push main, pr feature/login, and push experiment/scratch. Only the first two should create runs."
starter_files:
  - path: "app.py"
    content: "def order_total(price, qty):\n    return price * qty\n\n\ndef apply_discount(price, percent):\n    return price - price * percent / 100\n"
  - path: "test_app.py"
    content: "from app import apply_discount, order_total\n\n\ndef test_order_total():\n    assert order_total(250, 3) == 750\n\n\ndef test_apply_discount():\n    assert apply_discount(200, 10) == 180\n"
  - path: "requirements.txt"
    content: "pytest==8.3.3\nruff==0.7.4\n"
  - path: "README.md"
    content: "# orders-api\n\nOrder service for Acme Pay.\n"
  - path: ".github/workflows/ci.yml"
    content: "name: CI\non: [push]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.12'\n      - run: pip install -r requirements.txt\n      - run: pytest\n"
checks:
  - {"kind": "sim_state", "path": "runs", "contains": "CI push main completed/success", "label": "Push to main ran the workflow"}
  - {"kind": "sim_state", "path": "runs", "contains": "CI pull_request feature/login completed/success", "label": "The pull request ran the workflow"}
  - {"kind": "sim_command_used", "command": "push experiment/scratch", "label": "You pushed an experiment branch"}
  - {"kind": "sim_state", "path": "runs", "not_contains": "experiment/scratch", "label": "The experiment branch did not run CI"}
hints:
  - "Use the long form of on: with push and pull_request as separate keys."
  - "Under push add branches: [main]. Under pull_request add branches: [main]."
  - "Run the three commands in the terminal one by one: push main, pr feature/login, push experiment/scratch."
solution: solution/
unlocks: [p2-w07-ci-003]
tags: ["ci", "triggers"]
