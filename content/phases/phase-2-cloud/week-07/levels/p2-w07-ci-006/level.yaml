id: p2-w07-ci-006
title: "Keep test reports as artifacts"
phase: 2
week: 7
module: github-actions-cicd
order: 21
difficulty: 3
estimated_minutes: 15
type: console
environment: ci
lesson: ../../lessons/05-github-actions-pipelines.md
task: "A test is failing right now (that is on purpose). The workflow writes report.txt, but the upload step is skipped when pytest fails. Make the upload run even when an earlier step fails, then push to main. The run may stay red, but the test-report artifact must be uploaded."
starter_files:
  - path: "app.py"
    content: "def order_total(price, qty):\n    return price + qty\n\n\ndef apply_discount(price, percent):\n    return price - price * percent / 100\n"
  - path: "test_app.py"
    content: "from app import apply_discount, order_total\n\n\ndef test_order_total():\n    assert order_total(250, 3) == 750\n\n\ndef test_apply_discount():\n    assert apply_discount(200, 10) == 180\n"
  - path: "requirements.txt"
    content: "pytest==8.3.3\nruff==0.7.4\n"
  - path: "README.md"
    content: "# orders-api\n\nOrder service for Acme Pay.\n"
  - path: ".github/workflows/ci.yml"
    content: "name: CI\non: push\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.12'\n      - run: pip install -r requirements.txt\n      - run: pytest -q > report.txt\n      - uses: actions/upload-artifact@v4\n        with:\n          name: test-report\n          path: report.txt\n"
checks:
  - {"kind": "sim_state", "path": "log", "contains": "Artifact test-report has been successfully uploaded", "label": "The report artifact was uploaded"}
  - {"kind": "sim_state", "path": "runs", "contains": "CI push main completed/failure", "label": "The run is red because the test still fails"}
hints:
  - "By default a step is skipped after a failure. A step can opt in with an if: condition."
  - "Add if: always() to the upload-artifact step."
  - "The artifact name is test-report and its path is report.txt."
solution: solution/
unlocks: [p2-w07-ci-007]
tags: ["ci", "artifacts"]
