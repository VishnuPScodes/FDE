name: Release
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest
  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/deploy.sh staging 1.4.0
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/deploy.sh production 1.4.0
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
