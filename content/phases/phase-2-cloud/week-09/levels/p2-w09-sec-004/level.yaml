id: p2-w09-sec-004
title: Write a one page threat model
phase: 2
week: 9
module: security-posture
order: 4
difficulty: 3
estimated_minutes: 25
type: writing
environment: writing
lesson: ../../lessons/03-security-posture.md
task: Write a short threat model for the RupeeRoute refund service in `answer.md`. It lets shopkeepers refund UPI payments from a mobile app. Fill every section. Name at least three threats and pair each with a control.
starter_files:
  - path: answer.md
    content: |
      # Threat model: RupeeRoute refunds

      ## What we protect
      <!-- The data and money that matter. -->

      ## Entry points
      <!-- Where outsiders or other systems can reach us. -->

      ## Top threats
      <!-- At least three, with the kind of threat (spoofing, tampering, ...). -->

      ## Controls
      <!-- One control per threat. -->

      ## Residual risk
      <!-- What is left after the controls, and who accepts it. -->
checks:
  - kind: sim_state
    path: section:What we protect
    min_words: 12
  - kind: sim_state
    path: section:Entry points
    contains_any:
      - api
      - app
      - webhook
      - admin
  - kind: sim_state
    path: section:Top threats
    contains_any:
      - spoof
      - tamper
      - disclos
      - denial
      - repudiat
      - privilege
    min_words: 30
  - kind: sim_state
    path: section:Controls
    contains_any:
      - rate limit
      - mask
      - token
      - encrypt
      - validate
      - log
    min_words: 20
  - kind: sim_state
    path: section:Residual risk
    min_words: 10
  - kind: sim_state
    path: word_count
    min: 120
    max: 600
hints:
  - 'Use the STRIDE words: spoofing, tampering, repudiation, information disclosure, denial of service, elevation of privilege.'
  - For each threat, write one control that stops it or makes it cheaper to spot.
solution: solution/
unlocks:
  - p2-w09-sec-005
tags:
  - security
  - threat-model
  - writing
mobile_compatible: true
