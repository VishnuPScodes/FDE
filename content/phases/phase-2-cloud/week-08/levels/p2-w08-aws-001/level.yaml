id: p2-w08-aws-001
title: "Create a private S3 bucket"
phase: 2
week: 8
module: aws-core
order: 1
difficulty: 1
estimated_minutes: 10
type: terminal
environment: aws
lesson: ../../lessons/01-aws-core.md
task: "Create the bucket fde-invoices-mumbai in ap-south-1 with s3api create-bucket, turn on versioning, and set all four Block Public Access settings to true."
checks:
  - kind: sim_state
    path: "s3.buckets"
    contains: "fde-invoices-mumbai region=ap-south-1 versioning=Enabled block_public_access=all"
    label: "Bucket exists, versioned, public access fully blocked"
  - kind: sim_command_used
    command: "aws s3api put-public-access-block"
    label: "You set Block Public Access yourself"
hints:
  - "Outside us-east-1, s3api create-bucket needs --create-bucket-configuration LocationConstraint=ap-south-1."
  - "Block Public Access has four flags. Pass BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true to --public-access-block-configuration."
  - "Versioning uses: aws s3api put-bucket-versioning --bucket NAME --versioning-configuration Status=Enabled"
solution: solution/
unlocks: [p2-w08-aws-002]
tags: [aws, s3, security]
