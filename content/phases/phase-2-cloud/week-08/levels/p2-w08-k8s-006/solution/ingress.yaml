apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kirana
  namespace: shop
spec:
  ingressClassName: nginx
  rules:
    - host: kirana.example.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront
                port:
                  number: 80
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: orders-api
                port:
                  number: 80
