  - kind: checklist
    label: Self-review
    items:
      - All eight headings are filled
      - The Goal has a number
      - I stated assumptions in plain words
  - kind: ai_rubric
    rubric:
      - Goal is measurable
      - MVP is small and testable
      - Risks and rollout are concrete
    min_score: 3
hints:
  - Pick one goal and one measure. Expiry write-offs is the goal, stock-outs is the guardrail.
  - Keep the MVP to a report with a human approving each step. Forecasting can come later.
  - Say your assumptions in Data and Constraints, since you cannot ask questions here.
