lesson: ../../lessons/01-mock-loop.md
task: >-
  Timed mock, 25 minutes. Interviewer prompt:


  > "A chain of 60 pharmacies in Chennai throws away about ₹40 lakh of expired medicines a year,
  while popular medicines often run out. Leadership wants AI to fix this. Walk me through what you'd
  build."


  Fill all eight headings in `answer.md`. Write assumptions where you would normally ask.
timed: true
starter_files:
  - path: answer.md
    content: |
      # Mock: decomposition for a pharmacy chain

      ## Goal
      <!-- One or two sentences. -->

      ## Users
      <!-- One or two sentences. -->

      ## Data
      <!-- One or two sentences. -->

      ## Constraints
      <!-- One or two sentences. -->

      ## MVP
      <!-- One or two sentences. -->

      ## Architecture
      <!-- One or two sentences. -->

      ## Risks
      <!-- One or two sentences. -->

      ## Rollout
      <!-- One or two sentences. -->
