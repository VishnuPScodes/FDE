task: >-
  Timed mock, 25 minutes. Interviewer prompt:


  > "A Mumbai lending startup gives small loans to kirana shop owners. Loan officers spend about 45 minutes per application checking bank statements by hand, and 20% of applications are sent back for missing pages. Leadership wants AI to speed this up. Walk me through what you'd build."


  Fill all eight headings in `answer.md`. Write assumptions where you would normally ask.
timed: true
