  - path: answer.md
    content: |
      # Mock: decomposition for a lending startup

      ## Goal
      <!-- One or two sentences. -->

      ## Users
      <!-- One or two sentences. -->

      ## Data
      <!-- One or two sentences. -->

      ## Constraints
      <!-- One or two sentences. -->

      ## MVP
      <!-- One or two sentences. -->

      ## Architecture
      <!-- One or two sentences. -->

      ## Risks
      <!-- One or two sentences. -->

      ## Rollout
      <!-- One or two sentences. -->
