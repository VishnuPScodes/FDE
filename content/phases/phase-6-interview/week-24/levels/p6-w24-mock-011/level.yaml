      - MVP is small and testable
      - Risks and rollout are concrete
    min_score: 3
hints:
  - Pick one goal and one measure, such as minutes per application, and a guardrail such as default rate or wrong rejections.
  - The 20% sent back for missing pages may need no AI at all. A page-count and date-gap check before the officer sees the file is a strong MVP.
  - Keep a loan officer approving every decision. AI that rejects loans on its own is a regulatory and fairness risk.
  - Say your assumptions in Data and Constraints, since you cannot ask questions here.
