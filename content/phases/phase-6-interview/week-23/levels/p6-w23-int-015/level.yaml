id: p6-w23-int-015
title: Build your eight-story bank
phase: 6
week: 23
module: story-bank
order: 3
difficulty: 3
estimated_minutes: 60
type: writing
environment: writing
lesson: ../../lessons/03-customer-sims-and-stories.md
task: |-
  Week 23 checkpoint: your story bank covers all eight themes interviewers ask about.

  For each heading in `answer.md`, write a short STAR summary (3-5 sentences) and the project it comes from. **Measurable Impact** must include a number. **Ethical Call** should be a real choice where the easy option was wrong. Keep this file; you will use it all through your job search.
starter_files:
- path: answer.md
  content: |
    # Story bank

    ## Ambiguity


    ## Failure


    ## Pushback on a Customer


    ## Shipped Under Pressure


    ## Learned a Domain Fast


    ## Cross-team Conflict


    ## Ethical Call


    ## Measurable Impact
