  path: answer.md
  expected: '## Ambiguity'
- kind: file_contains
  path: answer.md
  expected: '## Failure'
- kind: file_contains
  path: answer.md
  expected: '## Pushback on a Customer'
- kind: file_contains
  path: answer.md
  expected: '## Shipped Under Pressure'
- kind: file_contains
