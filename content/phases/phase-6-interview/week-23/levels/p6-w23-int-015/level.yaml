- kind: checklist
  label: Self-review
  items:
  - I have said every story aloud at least once
  - At least three different projects appear in my bank
  - No story blames someone else for the problem
- kind: ai_rubric
  rubric:
  - Stories are specific and varied
  - Results are concrete
  min_score: 3
hints:
- One project can supply several stories, but use at least three projects across the bank.
- Pushback means you disagreed with a customer politely and explained why. Show the outcome.
- 'Measurable Impact needs a number: percent, hours, rupees or users.'
