task: |-
  Timed drill, aim for 25 minutes. Your GST-verification service calls a government API that blocks you if one client sends too many requests. Build a rolling-window rate limiter per client key.

  Implement `RateLimiter` in `limiter.py`. Use the injected `clock` so tests can control time. Rejected calls must not count towards the limit. Run `test_limiter.py`.
timed: true
