        """Allow at most `max_requests` per key in any rolling `window_seconds`."""

        def __init__(self, max_requests: int, window_seconds: float, clock=time.monotonic):
            pass

        def allow(self, key: str) -> bool:
            pass
- path: test_limiter.py
  content: |
    from limiter import RateLimiter


    class FakeClock:
        def __init__(self):
            self.now = 0.0

        def __call__(self):
            return self.now


    def test_limit_and_recover():
        clock = FakeClock()
        rl = RateLimiter(3, 10, clock=clock)
        assert [rl.allow("ca-firm") for _ in range(4)] == [True, True, True, False]
        clock.now = 9.9
        assert rl.allow("ca-firm") is False
        clock.now = 10.0
        assert rl.allow("ca-firm") is True


    def test_keys_are_separate():
        clock = FakeClock()
        rl = RateLimiter(1, 60, clock=clock)
        assert rl.allow("surat") is True
        assert rl.allow("pune") is True
        assert rl.allow("surat") is False


    def test_rejected_calls_do_not_count():
        clock = FakeClock()
        rl = RateLimiter(2, 10, clock=clock)
        rl.allow("k"); rl.allow("k")
        clock.now = 5
        assert rl.allow("k") is False
        clock.now = 10
        assert rl.allow("k") is True
        assert rl.allow("k") is True
