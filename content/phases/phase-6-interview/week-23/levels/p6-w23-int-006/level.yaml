id: p6-w23-int-006
title: 'Mock: circular search for a PSU bank'
phase: 6
week: 23
module: decomp-mocks
order: 2
difficulty: 4
estimated_minutes: 25
type: decomposition
environment: writing
lesson: ../../lessons/02-decomposition-mocks.md
task: |-
  Timed mock, 25 minutes. Prompt from the interviewer:

  > "A public-sector bank issues hundreds of policy circulars a year. Branch staff in 2,000 branches can't find the latest rule, and they phone the regional office. The CGM wants a GenAI assistant. Decompose it."

  Fill all eight headings in `answer.md`. Think about superseded circulars, citations and data that must not leave the bank.
timed: true
starter_files:
- path: answer.md
  content: |
    # Decomposition

    ## Goal


    ## Users


    ## Data


    ## Constraints


    ## MVP


    ## Architecture


    ## Risks


    ## Rollout
checks:
- kind: file_contains
  path: answer.md
  expected: '## Goal'
- kind: file_contains
  path: answer.md
  expected: '## Users'
- kind: file_contains
  path: answer.md
  expected: '## Data'
- kind: file_contains
  path: answer.md
  expected: '## Constraints'
- kind: file_contains
  path: answer.md
  expected: '## MVP'
- kind: file_contains
  path: answer.md
  expected: '## Architecture'
- kind: file_contains
  path: answer.md
  expected: '## Risks'
- kind: file_contains
  path: answer.md
  expected: '## Rollout'
- kind: sim_state
  path: word_count
  min: 220
  max: 900
- kind: sim_state
  path: section:Goal
  min_words: 12
  contains_any:
  - '%'
  - from
  - reduce
  - cut
  - increase
  - per
- kind: sim_state
  path: section:Data
  min_words: 15
- kind: sim_state
  path: section:Constraints
  min_words: 12
- kind: sim_state
  path: section:MVP
  min_words: 20
- kind: sim_state
  path: section:Architecture
  min_words: 20
- kind: sim_state
  path: section:Risks
  min_words: 25
  contains_any:
  - mitigat
  - fallback
  - human review
  - manual
- kind: sim_state
  path: section:Rollout
  min_words: 15
  contains_any:
  - pilot
  - phase
  - week
- kind: time_limit
  minutes: 25
  advisory: true
- kind: checklist
  label: Self-review
  items:
  - I wrote my assumptions where I could not ask a question
  - My MVP could ship in two to four weeks
  - Every risk has a mitigation
- kind: ai_rubric
  rubric:
  - Goal has a measurable metric
  - MVP is small and tied to the goal
  - Risks and rollout are realistic
  min_score: 3
hints:
- A good metric here is calls to the regional office, or time to an answer.
- Circulars replace older ones. Your design must return the latest valid version and cite it.
- Banks often cannot send data to public APIs. Name that constraint and how you would handle it.
