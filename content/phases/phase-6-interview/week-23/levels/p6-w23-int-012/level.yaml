task: |-
  Timed mock, 25 minutes. Prompt from the interviewer:

  > "We run a textile trading unit in Surat. Our accountants key about 600 supplier invoices a week into Tally and roughly 9% have an error: wrong GSTIN, wrong amount or a duplicate. Management wants AI to fix this. Walk me through what you'd build."

  Fill all eight headings in `answer.md`. Write assumptions where you would normally ask a question.
timed: true
starter_files:
- path: answer.md
  content: |
    # Decomposition

    ## Goal


    ## Users


    ## Data


    ## Constraints


    ## MVP


    ## Architecture


    ## Risks


    ## Rollout
