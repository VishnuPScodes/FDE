  min_score: 3
hints:
- 'Goal first: a number, a direction and a time frame. 9% errors down to what, by when?'
- 'Invoice errors have three causes here: wrong GSTIN, wrong amount, duplicates. Your MVP should target one. Some need no AI at all: a GSTIN format check or a duplicate check is plain code.'
- Risks need mitigations. Use words like fallback or manual review.
