name: Supabase keep-alive

# Supabase free-tier projects pause after 7 days without activity.
# A small authenticated REST read twice a week keeps the project awake.
on:
  schedule:
    - cron: '17 3 * * 1,4' # Mon & Thu, 08:47 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set; skipping."
            exit 0
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1")
          echo "Supabase responded with HTTP $status"
          # 200 (rows or none under RLS) or 401/406 still count as activity; only network failures fail the job.
          [ "$status" != "000" ]
